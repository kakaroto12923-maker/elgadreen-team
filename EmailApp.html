<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRA ELGADREEN</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#dc143c">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(220, 20, 60, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(220, 20, 60, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #111111;
            border: 2px solid #dc143c;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 580px;
            width: 100%;
            box-shadow: 
                0 0 40px rgba(220, 20, 60, 0.3),
                0 20px 60px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #dc143c, #8b0000, #dc143c);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 28px;
        }

        .social-links a:hover {
            transform: translateY(-5px) scale(1.1);
            border-color: #dc143c;
            box-shadow: 0 10px 25px rgba(220, 20, 60, 0.5);
        }

        .social-links a.whatsapp:hover {
            border-color: #25D366;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.5);
        }

        .social-links a.telegram:hover {
            border-color: #0088cc;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header .made-by-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .header .made-by-name {
            color: #dc143c;
            font-size: 24px;
            font-weight: bold;
            direction: ltr;
            text-shadow: 0 0 25px rgba(220, 20, 60, 0.7);
            letter-spacing: 1px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #dc143c, transparent);
            margin: 20px 0;
            opacity: 0.6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #dc143c;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #dc143c;
            direction: ltr;
            pointer-events: none;
            z-index: 1;
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #1a1a1a;
            color: #ffffff;
            direction: ltr;
            text-align: left;
        }

        input::placeholder {
            color: #555;
            font-size: 13px;
        }

        input:focus {
            outline: none;
            border-color: #dc143c;
            background: #1f1f1f;
            box-shadow: 0 0 20px rgba(220, 20, 60, 0.3);
        }

        input:hover {
            border-color: #8b0000;
        }

        .link-input {
            padding-left: 40px !important;
        }

        .optional-note {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            font-weight: normal;
        }

        .btn-send {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc143c 0%, #8b0000 100%);
            color: #ffffff;
            border: 2px solid #dc143c;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-shadow: 0 5px 20px rgba(220, 20, 60, 0.4);
        }

        .btn-send:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(220, 20, 60, 0.7);
            background: linear-gradient(135deg, #ff1744 0%, #dc143c 100%);
        }

        .btn-send:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(220, 20, 60, 0.5);
        }

        .status {
            margin-top: 15px;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            display: none;
            font-weight: bold;
            font-size: 14px;
        }

        .status.success {
            display: block;
            background: rgba(220, 20, 60, 0.15);
            color: #ff6b6b;
            border: 1px solid #dc143c;
        }

        .status.error {
            display: block;
            background: rgba(255, 0, 0, 0.1);
            color: #ff4444;
            border: 1px solid #ff0000;
        }

        .bottom-note {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #dc143c;
            font-weight: bold;
            line-height: 1.8;
            border-top: 1px solid #2a2a2a;
            padding-top: 15px;
            text-shadow: 0 0 15px rgba(220, 20, 60, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="social-links">
        <a href="https://chat.whatsapp.com/GblSdTHds2TAkoS5jETtd5?s=cl&p=a&mlu=0&ilr=4" target="_blank" class="whatsapp" title="WhatsApp">
            💬
        </a>
        <a href="https://t.me/elgadreen" target="_blank" class="telegram" title="Telegram">
            ✈️
        </a>
    </div>

    <div class="header">
        <div class="made-by-label">من صنع</div>
        <div class="made-by-name">𝑭𝑰𝑹𝑨 𝑬𝑳𝑮𝑨𝑫𝑹𝑬𝑬𝑵</div>
    </div>

    <div class="divider"></div>

    <div class="form-group">
        <label>👤 يوزر الحساب (اختياري)</label>
        <div class="input-icon-wrapper">
            <span class="input-icon">@</span>
            <input type="text" id="username" class="input-with-icon" placeholder="username" dir="ltr">
        </div>
    </div>

    <div class="form-group">
        <label>🔗 لينك الحساب (اختياري)</label>
        <div class="input-icon-wrapper">
            <span class="input-icon">🔗</span>
            <input type="text" id="link" class="link-input" placeholder="https://t.me/username" dir="ltr">
        </div>
        <div class="optional-note">⚠️ لو كتبت لينك بس، هيشتغل عادي</div>
    </div>

    <button class="btn-send" onclick="sendViaEmail()">اضرب يا زعيمم^</button>

    <div id="status" class="status"></div>

    <div class="bottom-note">
        لعمل حسابك مزيف او احتيالي او تطير الحسابات
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }

    function fixUsername(input) {
        let cleaned = input.replace(/^@+/, '');
        return '@' + cleaned;
    }

    function sendViaEmail() {
        const email = 'support@n26.com';
        const rawUsername = document.getElementById('username').value.trim();
        const link = document.getElementById('link').value.trim();

        if (rawUsername === '' && link === '') {
            const status = document.getElementById('status');
            status.className = 'status error';
            status.textContent = '❌ من فضلك اكتب يوزر الحساب أو اللينك';
            return;
        }

        let username = '';
        if (rawUsername !== '') {
            username = fixUsername(rawUsername);
        } else {
            username = 'غير محدد';
        }

        let finalLink = link !== '' ? link : 'غير محدد';

        const subject = `Urgent: Impersonation/Scam Alert - Fake N26 Telegram Account (${username})`;

        const body = `Dear N26 Support Team,

I am writing to urgently report a fake Telegram account that is impersonating your official support channel.

Account Details:

· Username: ${username}
· Link: ${finalLink}
· Claim: "Verified account of N26"

This account is using N26 s branding and name to deceive customers, falsely claiming to be your official support. As you can see in the attached screenshot, it appears in my contacts and could easily trick users into sharing sensitive information.

My Request:
I kindly ask that you contact Telegram s official support to report this account and request that they:

1. Place a clear warning sign next to the account.
2. Permanently classify it as a Scam/Fake account.

This is a serious security risk to all N26 customers. Please take immediate action to have this impersonator removed.

I have attached a screenshot for your reference.

Thank you for your prompt attention to this matter.`;

        const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        window.location.href = mailtoLink;

        const status = document.getElementById('status');
        status.className = 'status success';
        status.textContent = '🔥 تم فتح Gmail! اضغط إرسال';

        setTimeout(() => {
            status.className = 'status';
            status.textContent = '';
        }, 5000);
    }
</script>

</body>
</html>
